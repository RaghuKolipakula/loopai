<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopAI | Admin Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section {
            max-width: 600px;
            margin: 4rem auto;
            background: var(--surface);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-light);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .status-msg {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .status-success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }
        .status-error {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            display: block;
        }
    </style>
</head>
<body>
    <div class="background-gradients">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="container header-container">
            <h1 class="logo">Loop<span>AI</span></h1>
            <nav>
                <ul>
                    <li><a href="/">Discover Events</a></li>
                    <li><a href="/admin.html" class="active">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="admin-section">
            <h2 style="margin-bottom: 2rem; font-family: var(--font-display);">LoopAI Control Panel</h2>
            <p style="margin-bottom: 2rem; color: var(--text-muted);">Change the topic of the application dynamically. The AI will curate events based on the topic you provide here.</p>
            
            <form id="admin-form">
                <div class="form-group">
                    <label for="topic">New App Topic</label>
                    <input type="text" id="topic" placeholder="e.g. DFW Family Events, Austin Tech Meetups, Seattle Art Shows" required>
                </div>
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" placeholder="Enter admin password to save" required>
                </div>
                <button type="submit" class="btn primary-btn" id="save-btn" style="width: 100%; justify-content: center;">
                    Save New Topic
                </button>
            </form>

            <div id="status-message" class="status-msg"></div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
